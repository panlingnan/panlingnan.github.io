  <script>
(() => {
  const url = new URL(location.href);
  const route = url.searchParams.get('__foundation_route');
  let target = url;
  if (route && route.startsWith('/') && !route.startsWith('//')) {
    const requested = new URL(route, location.origin);
    if (requested.origin === location.origin) target = requested;
  }
  const pathname = target.pathname.length > 1 ? target.pathname.replace(/\/+$/, '') : target.pathname;
  if (target !== url || pathname !== url.pathname) history.replaceState(null, '', pathname + target.search + target.hash);
})();
</script>
